# Codebook pipeline configuration. Fully local: no APIs, no keys, no cloud.
#
# Every threshold that affects extraction quality lives here so behaviour can be
# tuned without touching code.

codebook:
  # Overrides the slug derived from the PDF filename. Set when a filename is a
  # poor identifier (e.g. "scan_final_v2.pdf").
  name: null
  standard: is456          # -> configs/standards/<standard>.yaml

paths:
  raw: data/raw
  extracted: data/extracted
  processed: data/processed
  vector_db: data/vector_db
  tools: tools

# --------------------------------------------------------------------------- #
# Phase 2 -- text and structure
# --------------------------------------------------------------------------- #
text_extraction:
  # Pass B: running heads are text in these page-height bands that recurs.
  header_band: 0.10
  footer_band: 0.10
  running_head_min_page_fraction: 0.6
  min_clause_chars: 2
  # A clause heading matched by regex is only trusted as a heading if its own
  # text is short; otherwise the number is inline prose.
  max_heading_chars: 120
  # Pass C: footnotes/marginalia are set smaller than body text. A heading must
  # be at least this fraction of the page's body font size. On IS 456 body text
  # is 10.3pt and footnotes 7-8.5pt, so 0.85 excludes them.
  min_heading_font_ratio: 0.85
  # Pass C: a heading is "typographically emphatic" when bold OR at least this
  # many points larger than body text.
  heading_font_advantage_pt: 0.5
  # Pass C: indentation cue. Clause headings indent with nesting depth in most
  # standards, so x0 is bucketed into a level. Buckets wider than this are
  # treated as one indent level.
  indent_bucket_pt: 8.0
  # Indentation must be used on at least this fraction of headings to be
  # trusted as a signal at all; otherwise it is ignored (single-level docs).
  indent_min_coverage: 0.30

# --------------------------------------------------------------------------- #
# Phase 3 -- tables
# --------------------------------------------------------------------------- #
table_extraction:
  # Three candidate generators, all gated by trimitdown_pdf.is_real_table.
  #
  # The obvious triple -- find_tables(), extract_table(strategy="text"),
  # extract_table(strategy="lines") -- is NOT used: `strategy=` is silently
  # discarded by pdfplumber (Table.extract forwards kwargs to utils.extract_text,
  # which reads only tolerance/layout keys), so all three return byte-identical
  # output and every table would be stamped "unanimous". These three genuinely
  # differ.
  strategies:
    lines: { vertical_strategy: lines, horizontal_strategy: lines }
    text:  { vertical_strategy: text,  horizontal_strategy: text,  text_x_tolerance: 2 }
    mixed: { vertical_strategy: lines, horizontal_strategy: text,  text_x_tolerance: 2 }
  # Candidate regions agreeing at or above this IoU are considered the same table.
  region_iou: 0.55
  # A region needs at least this many gated strategy votes to be kept.
  min_votes: 2
  # pdfplumber ignores x_tolerance once a ratio is set, so the ratio is the only
  # tolerance that reaches cell extraction.
  x_tolerance_ratio: 0.12
  y_tolerance: 3
  min_rows: 2
  min_cols: 2
  max_rows: 400
  max_markdown_rows: 60
  # Borderless tables: crop to the band each "Table N" caption opens and run the
  # text strategy inside. IS 456 has no ruling at all (page 28: two horizontal
  # rules, both header/footer, zero vertical) so lines finds 4 tables against 31
  # captions; this lifts it to 30.
  caption_band_fallback: true
  caption_band_fraction: 0.45
  # Verification renders for human review.
  render_verification_png: true
  verification_dpi: 300

# --------------------------------------------------------------------------- #
# Phase 4 -- figures
# --------------------------------------------------------------------------- #
figure_extraction:
  enabled: true
  timeout_seconds: 3600
  dpi: 300
  # Independent verification pass: vector-graphic regions from PyMuPDF drawings,
  # independent of PDFFigures 2.0. Crops are rendered at this DPI and are never
  # downscaled.
  verify_dpi: 600
  verification_enabled: true
  # Regions above this fraction of the page area are page furniture (a border
  # rule is ~80-85% of the page, which a plain area test would wave through --
  # and because it *contains* every figure, cluster merging would then swallow
  # each figure into the frame).
  suspect_max_page_area_fraction: 0.85
  suspect_min_area_pt2: 3000
  max_clause_gap_pt: 900
  # Orphans: uncaptioned vector regions worth saving. These are figure-like
  # blocks with no caption -- legend boxes, schematic panels.
  save_orphans: true
  orphan_min_area_pt2: 20000
  orphan_max_area_fraction: 0.35
  # A real drawing is many segments, or a raster image. One or two
  # rectangles is a stray rule, not a figure.
  orphan_min_parts: 4
  # Drawings closer than this belong to one region.
  cluster_gap_pt: 14.0

page_rendering:
  enabled: false
  dpi: 200

# --------------------------------------------------------------------------- #
# Phase 5 -- chunking
# --------------------------------------------------------------------------- #
chunking:
  max_words: 800
  min_words: 25

# --------------------------------------------------------------------------- #
# Phase 6 -- embeddings and retrieval
# --------------------------------------------------------------------------- #
embedding:
  # bge-large-en-v1.5 is 1024-dim and measured at 2.6 chunks/s on this 2-core
  # CPU (~3.6 min for a 114-page codebook). Falls back to bge-base if
  # `expected_dim` disagrees with the loaded model.
  model: BAAI/bge-large-en-v1.5
  expected_dim: 1024
  fallback_model: BAAI/bge-base-en-v1.5
  fallback_dim: 768
  batch_size: 16
  device: auto           # auto -> cuda when present, else cpu
  # bge models expect an asymmetric prefix on queries only.
  query_prefix: "Represent this sentence for searching relevant passages: "

retrieval:
  rrf_k: 60
  bm25_top_k: 20
  vector_top_k: 20
  final_top_k: 10

# --------------------------------------------------------------------------- #
# Phase 7 -- local instruction dataset. No API, no key.
# --------------------------------------------------------------------------- #
dataset_generation:
  enabled: true
  # qwen | template
  generator: qwen
  # Qwen3-4B is 8.04 GB of weights and this host has ~8.3 GB free with no CUDA,
  # so it OOMs; bitsandbytes 4-bit is CUDA-only (Linear4bit asserts on CPU).
  # Qwen3-1.7B (~3.4 GB bf16) is the largest that actually fits.
  model: Qwen/Qwen3-1.7B
  dtype: bfloat16
  max_chunks: 200
  qa_per_chunk: 3
  # Chunks sent to the local LLM; the rest fall back to templates. Qwen3-1.7B
  # measured at 0.42 tok/s on this 2-core CPU-only host, so each chunk costs
  # ~10 min at max_new_tokens=256. Set 0 for a fully templated, instant run.
  llm_max_chunks: 12
  max_new_tokens: 256
  temperature: 0.3
  top_p: 0.9
  # Qwen3 defaults to emitting a <think> block, which wastes the whole context
  # budget on reasoning the dataset does not want.
  enable_thinking: false
  # Refuse anything arithmetic: an LLM sizing a member invents a plausible,
  # confident, wrong number.
  forbid_calculation_intent: true
  # Reject answers whose numbers are absent from the source chunk.
  numeric_grounding: true

# --------------------------------------------------------------------------- #
# Phase 8 -- OCR
# --------------------------------------------------------------------------- #
ocr:
  enabled: true
  no_text_layer_char_threshold: 50
  # --oem 1 = LSTM only, --psm 6 = assume a single uniform block of text.
  oem: 1
  psm: 6
  dpi: 600
  lang: eng
  # Ignore a page when OCR disagrees badly with a sparse text layer -- that means
  # one of the two is hallucinating, and the page is flagged rather than merged.
  min_crosscheck_overlap: 0.35

# --------------------------------------------------------------------------- #
# Validation
# --------------------------------------------------------------------------- #
validation:
  # Any phase below this estimated accuracy makes the whole run DEGRADED.
  accuracy_target: 0.99
  spot_check_links: 10
  # Pages sampled for the manual clause count.
  sample_page_range: null

logging:
  level: INFO