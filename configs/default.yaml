# Codebook pipeline configuration.
# Every threshold that affects extraction quality lives here so behaviour can be
# tuned without touching code.

codebook:
  # Overrides the slug derived from the PDF filename. Set when a filename is a
  # poor identifier (e.g. "scan_final_v2.pdf").
  name: null
  standard: is456          # -> configs/standards/<standard>.yaml

paths:
  raw: data/raw
  extracted: data/extracted
  processed: data/processed
  vector_db: data/vector_db
  tools: tools

text_extraction:
  # Running heads are text in these page-height bands that recurs across pages.
  header_band: 0.10
  footer_band: 0.10
  # A normalised string seen on this fraction of pages (or more) is a running
  # head. Page numbers are stripped before comparison, so "Page 4 of 90" and
  # "Page 5 of 90" collapse to the same string.
  running_head_min_page_fraction: 0.6
  # Clause bodies smaller than this many characters are dropped as artefacts.
  min_clause_chars: 2
  # A clause heading line matching a clause number is trusted as a heading only
  # if its own text is short; otherwise it is body text that merely mentions a
  # clause, and is not used to open a new clause.
  max_heading_chars: 120
  # Footnotes and marginalia are set smaller than body text. A heading must be at
  # least this fraction of the page's body font size. On IS 456 body text is
  # 10.3pt and footnotes are 7-8.5pt, so 0.85 excludes them.
  min_heading_font_ratio: 0.85

table_extraction:
  # Primary candidate generator: ruled grids. These go straight to
  # pdfplumber.find_tables().
  vertical_strategy: lines
  horizontal_strategy: lines
  # Second candidate generator for borderless tables. trimitdown-pdf's line
  # strategy scored ~15% recall on IS 456 (9 grids vs 31 "Table N" captions); the
  # text strategy finds tables the line strategy misses entirely. This only
  # produces more *candidates* -- is_real_table remains the sole gate.
  text_strategy_fallback: true
  text_x_tolerance: 2
  # How far below a "Table N" caption to look for the table body. A table in
  # a codebook rarely runs more than ~45% of the page; going deeper just
  # swallows the prose that follows.
  caption_band_fraction: 0.45
  # MUST match trimitdown's X_TOLERANCE_RATIO. pdfplumber ignores x_tolerance
  # when a ratio is set, so every cell-text call must pass the ratio or words
  # silently re-glue at the 3pt default.
  x_tolerance_ratio: 0.12
  y_tolerance: 3
  # Cell counts below this are not worth a table record.
  min_rows: 2
  min_cols: 2
  # Cap on rows kept in json_data to stop a stray full-page grid from producing
  # a multi-megabyte record. markdown is truncated separately, below.
  max_rows: 400
  max_markdown_rows: 60

figure_extraction:
  enabled: true
  # Wall-clock budget for the whole document. figure-extractor's own default is
  # 300s for the whole file, which large codebooks blow through.
  timeout_seconds: 1800
  dpi: 300
  # Rendered-crop fallback. PDFFigures 2.0 is trained on scholarly papers and
  # frequently returns nothing for codebooks, so caption text is located with
  # PyMuPDF and the region below it is cropped independently.
  caption_fallback: true
  caption_fallback_height_mm: 90
  caption_fallback_dpi: 200
  # Anything outside these bounds is reported SUSPECT rather than trusted.
  suspect_min_area_pt2: 3000
  suspect_max_page_area_fraction: 0.85
  # Vertical gap (pt) beyond which a figure is no longer considered attached to
  # the nearest preceding clause heading.
  max_clause_gap_pt: 900

page_rendering:
  enabled: false          # opt-in: high-DPI page PNGs are large and slow
  dpi: 200

chunking:
  max_words: 800
  # Chunks smaller than this are merged into the previous chunk of the same
  # clause rather than embedded as their own near-duplicate vector.
  min_words: 25

embedding:
  model: BAAI/bge-small-en-v1.5
  # 384 for bge-small-en-v1.5; the pipeline asserts this rather than assuming.
  expected_dim: 384
  batch_size: 32
  # bge models are trained with an asymmetric retrieval prefix on queries only.
  query_prefix: "Represent this sentence for searching relevant passages: "
  collection_prefix: codebook

retrieval:
  # Reciprocal Rank Fusion constant.
  rrf_k: 60
  bm25_top_k: 20
  vector_top_k: 20
  final_top_k: 10

dataset_generation:
  enabled: true
  # gemini | openai_compatible
  # openai_compatible works with DeepSeek, Groq, Together, vLLM, LM Studio and
  # anything else speaking the /chat/completions shape -- set base_url and
  # api_key_env accordingly.
  provider: gemini
  # Gemini default.
  model: gemini-3.8-flash
  # --- OpenAI-compatible settings (ignored unless provider is openai_compatible)
  # base_url: https://api.deepseek.com/v1
  # model: deepseek-chat
  # api_key_env: DEEPSEEK_API_KEY
  timeout_seconds: 120
  max_chunks: 500
  qa_per_chunk: 3
  temperature: 0.4
  max_output_tokens: 2048
  requests_per_minute: 10
  max_retries: 3
  # Generation is refused for these intents: an LLM asked to do arithmetic
  # against a codebook invents plausible numbers. See instruction_generator.py.
  forbid_calculation_intent: true

ocr:
  enabled: true
  # A page yielding fewer than this many characters is treated as having no
  # text layer and routed to OCR.
  no_text_layer_char_threshold: 50
  marker_model: null      # null = marker-pdf default

logging:
  level: INFO